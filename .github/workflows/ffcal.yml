name: Calendar

# 📅 (2026-11-13) calendar· off TradingView: after every "Live feed" run, ffcal.py reads Forex Factory's week (at most once an
# hour) and decides whether an alert is due (🔴 / 🟠 5 min ahead, ⚪ holidays 06:40, 📋 the digest 06:45 Berlin), pushes
# calendar.json first (the claim), then sends it.
# Source of truth: spec1re/r3m-digest/site-ci/ (ffcal.py is copied by the site deploy, this file is pushed by hand).
on:
  workflow_run:
    workflows: ["Live feed"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry:
        description: "print the decision and the message, send and write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ffcal
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: plan
        run: python3 .github/ffcal.py plan calendar.json "$RUNNER_TEMP/cal.json" ${{ inputs.dry && '--dry' || '' }}
      - name: Claim
        if: steps.plan.outputs.write == '1'
        run: |
          git config user.name "R3M calendar"
          git config user.email "noreply@github.com"
          git add calendar.json
          git commit -qm "calendar"
          cp calendar.json "$RUNNER_TEMP/c.json"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin HEAD:main && exit 0
            sleep $((i * 2 + RANDOM % 5))
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/c.json" calendar.json
            git add calendar.json && { git diff --cached --quiet && exit 0; git commit -qm "calendar"; }
          done
          exit 1
      - name: Send
        if: steps.plan.outputs.send == '1'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 .github/ffcal.py send "$RUNNER_TEMP/cal.json"
