# The Reef's deploy (2026-11-06): GitHub's own "deploy from a branch" build is cancelled by every newer push, and the live
# feed, the live layer and the Kronos checks push every minute or so in market hours: 30+ builds in a row were cancelled,
# the page served data an hour old. This deploy lets a running one finish (one running, the newest waiting) · needs
# Settings → Pages → Source: GitHub Actions · reference copy: r3m-digest site-ci/pages.yml
# Same evening: "Run failed" mails · a deploy hit "in progress deployment" (the one before still being processed by Pages)
# → it waits and tries twice more, and a run whose main is already live (deployed.txt on the site) skips the deploy
# Later that evening: deploys still took up to 10 min and timed out · the page now reads live.json, kronos-live.json,
# symbols.json and oracle.json from raw.githubusercontent, so the live workflows no longer trigger a deploy: only a push
# (the r3m-digest site build, a PAT push) or a dispatch does
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: chk
        run: |
          head=$(git rev-parse HEAD)
          live=$(curl -fsS "https://spec1re.github.io/r3m/deployed.txt?t=$(date +%s)" 2>/dev/null | head -c 40 || true)
          echo "main $head · live $live"
          if [ "$live" = "$head" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "$head" > deployed.txt
      - if: steps.chk.outputs.skip != '1'
        uses: actions/configure-pages@v5
      - if: steps.chk.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        if: steps.chk.outputs.skip != '1'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.chk.outputs.skip != '1' && steps.d.outcome == 'failure'
        run: sleep 60
      - id: d2
        if: steps.chk.outputs.skip != '1' && steps.d.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.chk.outputs.skip != '1' && steps.d.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 120
      - id: d3
        if: steps.chk.outputs.skip != '1' && steps.d.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
